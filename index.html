    <meta name="description" content="All'inizio del 2025, prevediamo di riunire la prossima generazione di changemaker italiani in uno dei più grandi eventi giovanili del paese. Che si tratti di studenti che sviluppano tecnologia, fanno ricerche di alto livello o incidono in modo significativo sulle loro comunità, EclipseITALIA presenterà le iniziative giovanili e ispirerà i giovani a perseguire progetti di grande impatto oltre la classe. Dai relatori a una sala espositiva, dalla robotica all'avanguardia alle arti, EclipseITALIA ridisegnerà il modo in cui i giovani prendono le decisioni più importanti del mondo. Siamo un'organizzazione globale con sede originariamente a Waterloo, il centro nevralgico dell'innovazione in Canada." />
